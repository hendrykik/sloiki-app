services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sloiki-backend
    pull_policy: build
    container_name: backend-app
    env_file:
      - backend/.env
    ports:
      - "8002:8002"
    networks:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    restart: unless-stopped
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=DB
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
